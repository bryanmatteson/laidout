[package]
name = "laidout"
version = "0.3.0"
authors = ["Bryan Matteson <7145232+bryanmatteson@users.noreply.github.com>"]
edition = "2021"
rust-version = "1.85"
description = "Standalone prepared-document layout kernel with reusable allocation-controlled workspaces"
license = "MIT"
repository = "https://github.com/bryanmatteson/laidout"
homepage = "https://github.com/bryanmatteson/laidout"
documentation = "https://docs.rs/laidout"
readme = "README.md"
keywords = ["layout", "pretty-printing", "terminal", "unicode"]
categories = ["command-line-interface", "text-processing"]
include = [
    "src/*.rs",
    "examples/*.rs",
    "support/*.rs",
    "proofs/*.sh",
    "proofs/*.smt2",
    "docs/aligned-tables.md",
    "docs/benchmark-dependency-transition-0.3.toml",
    "docs/cost-model-proofs.md",
    "docs/migration-0.2.md",
    "docs/migration-0.3.md",
    "CHANGELOG.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "README.md",
    "SECURITY.md",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
research = ["dep:num-bigint"]

[dependencies]
num-bigint = { version = "0.4.6", optional = true }
thiserror = "2"
unicode-width = "0.2"

[dev-dependencies]
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
static_assertions = "1"
toml = "0.9"
trybuild = "1"

[[bench]]
name = "prepared_kernel"
harness = false
required-features = ["research"]
